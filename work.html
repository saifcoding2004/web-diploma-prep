<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>form</title>
</head>

<body>
    <h2>log into faceboke</h2>
    <form action="" method="get">
        <label for="mail">:</label>
        <input id="mail" type="email" name="email" placeholder="Email or mobile number" required autocomplete="off">
        <br><br>
        <label for="pass">:</label>
        <input id pass type="password" name="pass" placeholder="password" required autocomplete="off">
        <br><br>
        <button type="submit">log in</button>
    </form>
</body>

</html>
